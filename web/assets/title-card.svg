<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Secure Mitigation System title card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050a"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#38e1c6" stroke-width="3" opacity="0.6"/>
  <!-- locked-room motif: shield outline -->
  <g transform="translate(120,150)" fill="none" stroke="#38e1c6" stroke-width="10" stroke-linejoin="round">
    <path d="M100 10 L190 42 V120 C190 190 150 240 100 270 C50 240 10 190 10 120 V42 Z"/>
    <path d="M70 120 L95 145 L135 95" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- red vs blue dots -->
  <circle cx="470" cy="220" r="26" fill="#ff5470"/>
  <circle cx="560" cy="220" r="26" fill="#4aa8ff"/>
  <line x1="496" y1="220" x2="534" y2="220" stroke="#8b93a3" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="430" y="200" fill="#8b93a3" font-family="monospace" font-size="24">RED</text>
  <text x="540" y="200" fill="#8b93a3" font-family="monospace" font-size="24">BLUE</text>
  <!-- project name -->
  <text x="420" y="330" fill="#f2f5f9" font-family="monospace" font-size="64" font-weight="bold">SECURE MITIGATION</text>
  <text x="420" y="400" fill="#38e1c6" font-family="monospace" font-size="64" font-weight="bold">SYSTEM</text>
  <!-- 0 to 1 to receipt strip -->
  <g font-family="monospace" font-size="30">
    <rect x="420" y="450" width="90" height="60" fill="none" stroke="#8b93a3" stroke-width="3"/>
    <text x="445" y="492" fill="#8b93a3">0</text>
    <line x1="520" y1="480" x2="570" y2="480" stroke="#38e1c6" stroke-width="4"/>
    <polygon points="570,470 590,480 570,490" fill="#38e1c6"/>
    <rect x="600" y="450" width="90" height="60" fill="none" stroke="#38e1c6" stroke-width="3"/>
    <text x="625" y="492" fill="#38e1c6">1</text>
    <line x1="700" y1="480" x2="750" y2="480" stroke="#38e1c6" stroke-width="4"/>
    <polygon points="750,470 770,480 750,490" fill="#38e1c6"/>
    <rect x="780" y="450" width="220" height="60" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="795" y="492" fill="#ffd166" font-size="26">RECEIPT</text>
  </g>
  <text x="420" y="560" fill="#8b93a3" font-family="monospace" font-size="22">red probes the boundary // blue patches it // receipt proves it</text>
</svg>
